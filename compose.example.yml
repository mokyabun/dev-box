services:
  devbox:
    image: "${DEVBOX_IMAGE:-ghcr.io/mokyabun/dev-box:latest}"
    container_name: devbox
    hostname: devbox
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Seoul}"
      PUID: "${PUID:-1001}"
      PGID: "${PGID:-1001}"
      CODE_SERVER_PASSWORD: "${CODE_SERVER_PASSWORD:?set CODE_SERVER_PASSWORD in .env}"
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:-opencode}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}"
      DEVBOX_SSH_AUTHORIZED_KEYS: "${DEVBOX_SSH_AUTHORIZED_KEYS:-}"
      WORKSPACE_DIR: /workspace
    networks:
      - proxy-trusted
    ports:
      - "10.101.0.3:${DEVBOX_SSH_PORT:-2223}:2222"
    volumes:
      # The home mount persists mise tools, downloads, config, and state.
      - "${APP_DATA_ROOT:-/data/compose/appdata}/devbox/home:/home/dev"
      - "${APP_DATA_ROOT:-/data/compose/appdata}/devbox/ssh:/etc/devbox/ssh"
      - "${DEV_WORKSPACE_ROOT:-/data/compose/appdata}/devbox/workspace:/workspace"
    # The OCI daemon enables this globally. Disable it only for this trusted
    # single-user dev container so passwordless sudo works inside the box.
    security_opt:
      - no-new-privileges:false
